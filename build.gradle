plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'kingstonduo'

archivesBaseName = 'cassiopeia-data'
version = '1.6'

jar {
    archiveBaseName = 'cassiopeia-data'
    archiveVersion = '1.6'
}

repositories {
    mavenCentral()
}

sourceCompatibility = 21
targetCompatibility = 21

processResources {
    filesMatching('application.properties') {
        expand(
            jar: [
                baseName: archivesBaseName,
                version: version
            ]
        )
    }
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-data-mongodb")
    implementation("org.springframework.boot:spring-boot-starter-web")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
}

springBoot {
    mainClass = "org.kpmp.Application"
}

def getCurrentGitBranch() {
  if (project.hasProperty('tag')) {
    def tagValue = project.property('tag')
    return tagValue
  } else {
      def gitBranch = "Unknown branch"
      try {
        def workingDir = new File("${project.projectDir}")
        def result = 'git rev-parse --abbrev-ref HEAD'.execute(null, workingDir)
        result.waitFor()
        if (result.exitValue() == 0) {
            gitBranch = result.text.trim()
        }
      } catch (e) {
        }
        if (gitBranch == "develop" || gitBranch == "master"){
          return project.version
        }else{
          return gitBranch
        }
    }
}

bootBuildImage {
    imageName = "kingstonduo/cassiopeia-data:" + getCurrentGitBranch()
    createdDate = "now"
}